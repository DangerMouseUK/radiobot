# Secret scanning (the `secrets` job in .github/workflows/security.yml).
# Every default gitleaks rule stays on. The allowlist below names only the obvious fakes used in
# documentation and tests, which the default Discord rules otherwise report as real IDs or secrets.
title = "Radio Bot"

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures, not credentials"
regexTarget = "secret"
regexes = [
  # The placeholder in .env.example and the tests that load it.
  '''^replace-with-your-[a-z-]+$''',
  # Fake Discord IDs: 123456789012345678 (and its 2…/3… variants), repeated digits such as
  # 111111111111111111, and 700000000000000001-style sequences.
  '''^[1-9]23456789012345678$''',
  '''^(?:1{18}|2{18}|3{18}|4{18}|5{18}|6{18}|7{18}|8{18}|9{18})$''',
  '''^[1-9]0{16}[0-9]$''',
]
