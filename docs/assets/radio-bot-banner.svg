<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 480" width="1360" height="480">
  <title>Radio Bot banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="440" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="1360" height="480" fill="url(#bg)"/>

  <!-- Signal waves spreading from the left edge -->
  <g fill="none" stroke="#FDE68A" stroke-width="18" stroke-linecap="round">
    <path d="M 120 140 A 160 160 0 0 1 120 340" opacity="0.22"/>
    <path d="M 175 70 A 260 260 0 0 1 175 410" opacity="0.15"/>
    <path d="M 225 0 A 370 370 0 0 1 225 480" opacity="0.1"/>
    <path d="M 290 -60 A 480 480 0 0 1 290 540" opacity="0.06"/>
  </g>

  <!-- Name and tagline -->
  <!-- Kept left of the profile card's top-right menu button and right of the avatar -->
  <text x="560" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="700" fill="#FFF7E0">Radio Bot</text>
  <text x="564" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="500" fill="#C7D2FE">Live radio in your voice channels</text>

  <!-- Equaliser -->
  <g fill="url(#bars)" transform="translate(-80 0)">
    <rect x="644" y="408" width="20" height="32" rx="10"/>
    <rect x="678" y="384" width="20" height="56" rx="10"/>
    <rect x="712" y="352" width="20" height="88" rx="10"/>
    <rect x="746" y="376" width="20" height="64" rx="10"/>
    <rect x="780" y="328" width="20" height="112" rx="10"/>
    <rect x="814" y="360" width="20" height="80" rx="10"/>
    <rect x="848" y="392" width="20" height="48" rx="10"/>
    <rect x="882" y="344" width="20" height="96" rx="10"/>
    <rect x="916" y="304" width="20" height="136" rx="10"/>
    <rect x="950" y="336" width="20" height="104" rx="10"/>
    <rect x="984" y="368" width="20" height="72" rx="10"/>
    <rect x="1018" y="320" width="20" height="120" rx="10"/>
    <rect x="1052" y="352" width="20" height="88" rx="10"/>
    <rect x="1086" y="384" width="20" height="56" rx="10"/>
    <rect x="1120" y="336" width="20" height="104" rx="10"/>
    <rect x="1154" y="364" width="20" height="76" rx="10"/>
    <rect x="1188" y="392" width="20" height="48" rx="10"/>
    <rect x="1222" y="372" width="20" height="68" rx="10"/>
    <rect x="1256" y="400" width="20" height="40" rx="10"/>
    <rect x="1290" y="380" width="20" height="60" rx="10"/>
    <rect x="1324" y="404" width="20" height="36" rx="10"/>
  </g>
</svg>
