<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Radio Bot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: Discord crops the icon to a circle -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Centred on the drawing's bounds, nudged slightly above the middle so it looks centred -->
  <g transform="translate(512 500) scale(1.2) translate(-512 -540.5)">
  <!-- Signal arcs around the antenna tip -->
  <g fill="none" stroke="#FDE68A" stroke-width="24" stroke-linecap="round">
    <path d="M 559.5 290.1 A 62 62 0 0 1 559.5 369.9"/>
    <path d="M 594.7 260.6 A 108 108 0 0 1 594.7 399.4"/>
    <path d="M 464.5 290.1 A 62 62 0 0 0 464.5 369.9"/>
    <path d="M 429.3 260.6 A 108 108 0 0 0 429.3 399.4"/>
  </g>

  <!-- Antenna -->
  <rect x="500" y="330" width="24" height="140" rx="12" fill="#FDE68A"/>
  <circle cx="512" cy="330" r="30" fill="#FB7185"/>

  <!-- Tuning knobs (ears) -->
  <rect x="216" y="570" width="60" height="130" rx="24" fill="#D97706"/>
  <rect x="748" y="570" width="60" height="130" rx="24" fill="#D97706"/>

  <!-- Radio body -->
  <rect x="252" y="450" width="520" height="370" rx="96" fill="url(#body)"/>

  <!-- Display (face) -->
  <rect x="312" y="510" width="400" height="250" rx="64" fill="#1E1B4B"/>

  <!-- Eyes -->
  <rect x="384" y="555" width="64" height="84" rx="32" fill="#67E8F9"/>
  <rect x="576" y="555" width="64" height="84" rx="32" fill="#67E8F9"/>

  <!-- Equaliser mouth -->
  <g fill="#FBBF24">
    <rect x="404" y="688" width="24" height="36" rx="12"/>
    <rect x="444" y="672" width="24" height="52" rx="12"/>
    <rect x="484" y="660" width="24" height="64" rx="12"/>
    <rect x="524" y="676" width="24" height="48" rx="12"/>
    <rect x="564" y="666" width="24" height="58" rx="12"/>
    <rect x="604" y="690" width="24" height="34" rx="12"/>
  </g>
  </g>
</svg>
