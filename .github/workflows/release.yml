name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The same checks as CI, so a tag on an untested commit never publishes an image.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in package.json and compose.yaml
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version" ||
            { echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version"; exit 1; }
          grep -q "radio-bot:${version}}" compose.yaml ||
            { echo "::error::compose.yaml's default image tag is not $version"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Validate catalogue
        run: node scripts/validate-catalogue.ts
      - run: pnpm test
      - run: pnpm build

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Registry references must be lower-case; repository_owner may contain capitals.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-bot" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Radio Bot ${{ github.ref_name }} — an **unofficial** integration, **not affiliated with or endorsed by** Radio FG / Maison FG or any broadcaster.
            See CHANGELOG.md for details and docs/rights-and-disclaimer.md before distributing or operating publicly.
