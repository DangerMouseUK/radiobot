name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The same checks as CI, so a tag on an untested commit never publishes an image.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in package.json and compose.yaml
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version" ||
            { echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version"; exit 1; }
          grep -q "radio-bot:${version}}" compose.yaml ||
            { echo "::error::compose.yaml's default image tag is not $version"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Validate catalogue
        run: node scripts/validate-catalogue.ts
      # The distro FFmpeg, like the Docker image's. ffmpeg-static's Linux build crashes on the HLS fixtures.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm test:coverage
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
      - run: pnpm build

  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck the installer and manager
        run: shellcheck -x install.sh scripts/radio-bot.sh tests/lifecycle/run.sh tests/lifecycle/fake-docker
      - name: Install, update, back up and uninstall against a fake Docker
        run: bash tests/lifecycle/run.sh

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: radio-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image (FFmpeg with libopus, config validation)
        run: |
          docker run --rm --entrypoint ffmpeg radio-bot:ci -hide_banner -encoders | grep -q libopus
          set +e
          docker run --rm radio-bot:ci > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" = "78"
          grep -q "DISCORD_TOKEN" out.txt

  image:
    needs: [test, lifecycle, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Registry references must be lower-case; repository_owner may contain capitals.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-bot" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Otherwise the action names the image after the repository ("radiobot").
          labels: |
            org.opencontainers.image.title=Radio Bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Radio Bot ${{ github.ref_name }}: an independent project, **not affiliated with or endorsed by any broadcaster**.
            See CHANGELOG.md for what changed, and docs/rights-and-disclaimer.md before running it for anyone other than yourself.
