name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The same checks as CI, so a tag on an untested commit never publishes an image.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in package.json and compose.yaml
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version" ||
            { echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version"; exit 1; }
          grep -q "radio-bot:${version}}" compose.yaml ||
            { echo "::error::compose.yaml's default image tag is not $version"; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Validate catalogue
        run: node scripts/validate-catalogue.ts
      # The distro FFmpeg, like the Docker image's. ffmpeg-static's Linux build crashes on the HLS fixtures.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm test:coverage
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
      - run: pnpm build
      - name: Smoke test the build
        run: pnpm smoke
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

  node-minimum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the installer and manager
        run: shellcheck -x install.sh scripts/radio-bot.sh tests/lifecycle/run.sh tests/lifecycle/fake-docker
      - name: Install, update, back up and uninstall against a fake Docker
        run: bash tests/lifecycle/run.sh

  lifecycle-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: The system bash is 3.2
        run: /bin/bash --version | head -n 1 | grep -F 'version 3.2'
      - name: Parse the scripts with bash 3.2
        run: for f in install.sh scripts/radio-bot.sh tests/lifecycle/run.sh tests/lifecycle/fake-docker; do /bin/bash -n "$f"; done
      - name: Install, update, back up and uninstall against a fake Docker, with bash 3.2
        run: /bin/bash tests/lifecycle/run.sh

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: radio-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image (FFmpeg with libopus, config validation)
        run: |
          docker run --rm --entrypoint ffmpeg radio-bot:ci -hide_banner -encoders | grep -q libopus
          set +e
          docker run --rm radio-bot:ci > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" = "78"
          grep -q "DISCORD_TOKEN" out.txt
      - name: Smoke test the image's build with its own Node and FFmpeg, offline
        run: docker run --rm --network none --entrypoint node radio-bot:ci dist/scripts/smoke.js
      # Pinned by commit: this action's version tags were once rewritten by an attacker.
      - name: Scan the image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: radio-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build the test stage (same base as the image)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          load: true
          tags: radio-bot:test
          cache-from: |
            type=gha
            type=gha,scope=test
      - name: Integration tests on the image's Node and FFmpeg, offline
        run: docker run --rm --network none radio-bot:test

  image:
    needs: [test, node-minimum, lifecycle, lifecycle-macos, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # Registry references must be lower-case; repository_owner may contain capitals.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-bot" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Otherwise the action names the image after the repository ("radiobot").
          labels: |
            org.opencontainers.image.title=Radio Bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            Radio Bot ${{ github.ref_name }}: an independent project, **not affiliated with or endorsed by any broadcaster**.
            See CHANGELOG.md for what changed, and docs/rights-and-disclaimer.md before running it for anyone other than yourself.
